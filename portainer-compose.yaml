# Portainer Docker Standalone stack.
# Upload .env under the stack's Environment variables section before deploying.
# Variables are passed explicitly: no env_file on the Portainer server is needed.
services:
  chatzy-bot:
    image: ghcr.io/love-not-found/chatzy-bot:latest
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
      DISCORD_NOTIFY_WEBHOOK_URL: "${DISCORD_NOTIFY_WEBHOOK_URL:-}"
      DISCORD_WEBHOOK_NAME: "${DISCORD_WEBHOOK_NAME:-Chatzy Bot}"
      CHATZY_ROOM_URL: "${CHATZY_ROOM_URL}"
      CHATZY_ALIAS: "${CHATZY_ALIAS:-Room Bot}"
      CHATZY_PASSWORD: "${CHATZY_PASSWORD:-}"
      CHATZY_AUTO_JOIN: "${CHATZY_AUTO_JOIN:-false}"
      CHATZY_SEND_INTERVAL_MS: "${CHATZY_SEND_INTERVAL_MS:-1200}"
      CHATZY_MAX_AUTO_RETRIES: "${CHATZY_MAX_AUTO_RETRIES:-5}"
      CHATZY_RECOVERY_TIMEOUT_MS: "${CHATZY_RECOVERY_TIMEOUT_MS:-120000}"
      CHATZY_KEEPALIVE: "${CHATZY_KEEPALIVE:-true}"
      CHATZY_KEEPALIVE_MIN_MS: "${CHATZY_KEEPALIVE_MIN_MS:-600000}"
      CHATZY_KEEPALIVE_MAX_MS: "${CHATZY_KEEPALIVE_MAX_MS:-1500000}"
      VNC_PASSWORD: "${VNC_PASSWORD:-}"
      NOVNC_PUBLIC_URL: "${NOVNC_PUBLIC_URL:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Keep these internal paths/ports fixed, regardless of local .env values.
      DATA_DIR: /data
      CONFIG_DIR: /config
      WEBUI_PASSWORD: "${WEBUI_PASSWORD:-}"
      HEALTH_PORT: "8080"
    volumes:
      # Create these directories on the Docker host, writable by uid 1000.
      - "${DATA_PATH:-/opt/chatzy-bot/data}:/data"
      - "${CONFIG_PATH:-/opt/chatzy-bot/config}:/config"
    ports:
      # Set NOVNC_BIND to the Docker host's LAN/VPN IP for remote access.
      - "${NOVNC_BIND:-127.0.0.1}:6080:6080"
      - "${WEBUI_BIND:-127.0.0.1}:3000:3000"
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    stop_grace_period: 30s
