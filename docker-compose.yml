services:
  chatzy-bot:
    # Prebuilt image from https://github.com/love-not-found/chatzy-bot
    # (built by the "Docker image" GitHub Actions workflow).
    image: ghcr.io/love-not-found/chatzy-bot:latest
    # To build from source instead, uncomment and run `docker compose up -d --build`.
    # build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      CONFIG_DIR: /config
    volumes:
      # Legacy browser data retained for migration to /config/browser-profile.
      - ./data:/data
      # Persistent settings, custom commands, and browser profile (uid 1000).
      - "${CONFIG_PATH:-./config}:/config"
    ports:
      # noVNC for manual browser control. Keep it private: LAN/VPN address or 127.0.0.1 + SSH tunnel.
      - "${NOVNC_BIND:-127.0.0.1}:6080:6080"
      - "${WEBUI_BIND:-127.0.0.1}:3000:3000"
    shm_size: 1gb
    # Duplicated from the Dockerfile because Podman's OCI image format drops HEALTHCHECK.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    # Time to send /bye and close the browser before being killed.
    stop_grace_period: 30s
